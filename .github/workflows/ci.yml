name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@6bd06a55307dccfd7057c1c3260067eb8adc93a1 # v0.6.79
    permissions:
      contents: read
    with:
      hosted-runner: ubuntu-24.04
      tools: just@1.59.0,zizmor@1.32.0
      tool-assets: .github/ci-tools.json
      fetch-depth: 0

  gate:
    needs: [check]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Require the complete shared source verdict
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'map_values(.result) == {"check":"success"}' <<< "$NEEDS"
